<body>
  <nav class="nav">
    <div class="container wide">
      <a class="brand" href="index.html"><span class="brand-mark"></span><span>Haoyu<span class="full"> 的 AI 工具箱</span></span></a>
      <div class="nav-links">
        <a href="index.html" aria-current="page">首页</a>

        <a href="about.html">关于</a>
      </div>
    </div>

  <main>
    <section class="hero">
      <div class="container">
        <span class="eyebrow reveal">Haoyu 的 AI 工具箱</span>
        <h1 class="headline reveal d1">每天学一点。<br><span class="gradient-text"><span class="nb">每天多一个</span><span class="nb">能用的小工具。</span></span></h1>
        <p class="lead reveal d2">这里记录我学 AI 的每一天：当天学到的道理，我亲手做的练习，和一个点开就能用的小工具。</p>
        <div class="links reveal d3"><a href="#latest">看最新一课</a><a href="about.html">认识我</a></div>
        <div class="stats reveal d4">
          <div class="stat"><b id="s-days">0</b><span>学习天数</span></div>
          <div class="stat"><b id="s-tools">0</b><span>小工具</span></div>
          <div class="stat"><b id="s-pct">0%</b><span>四周课程进度</span></div>
          <div class="stat"><b id="s-learned">0 / 0</b><span>已学完</span></div>
        </div>
        <nav class="dock reveal d4" id="dock" aria-label="我做过的工具"></nav>
      </div>
    </section>

    <section class="section alt tight" id="latest">
      <div class="container">
        <div id="showcase"></div>
      </div>
    </section>

    <section class="section" id="all">
      <div class="container wide">
        <div class="center">
          <h2 class="title reveal">全部课程</h2>
          <p class="lead reveal d1" style="margin-bottom:56px">每一课都有笔记、练习和一个小工具。</p>
        </div>
        <div class="tiles" id="tiles"></div>
      </div>
    </section>

    <section class="section alt">
      <div class="container wide">
        <div class="center">
          <h2 class="title reveal">四周，从写字到做产品。</h2>
          <p class="lead reveal d1">写字是地基，图片和 PPT 是表达，最后把学到的东西做成一件真正的产品。</p>
        </div>
        <div class="roadmap" id="roadmap"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container wide">
      <span class="crumbs"><a href="index.html">Haoyu 的 AI 工具箱</a></span>
      <span><a href="about.html">关于</a></span>
      <span class="copy">© 2026 Haoyu · 和 Claude 一起，一天一块砖。</span>
    </div>
  </footer>

  <script src="assets/days.js"></script>
  <script src="assets/site.js"></script>
  <script src="assets/xuewan.js"></script>
  <script>
    (function () {
      const days = (window.DAYS || []).slice().sort((a, b) => b.day - a.day);
      const weeks = window.WEEKS || [];
      const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const glyph = (d, cls) => `<div class="glyph ${cls || ""}" style="${d.grad ? `--g:${esc(d.grad)}` : ""}">${esc(d.glyph || d.day)}</div>`;
      const weekName = n => (weeks.find(w => w.n === n) || {}).title || "";
      // 读者自己的学完记录（只存在这个浏览器里）；xuewan.js 没加载到时就不显示学完，首页照常
      const xuewan = window.Xuewan ? window.Xuewan.createXuewan(window.Xuewan.browserStore) : null;

      // 最新一课
      const latest = days[0];
      if (latest) {
        document.getElementById("showcase").innerHTML = `
          <a class="showcase reveal" href="${esc(latest.url)}">
            ${glyph(latest)}
            <span class="badge-new">最新 · DAY ${latest.day}</span>
            <h2 class="title">${esc(latest.title)}</h2>
            <p class="lead">${esc(latest.summary)}</p>
            <div class="links"><span style="color:var(--accent-text)">阅读这一课 ›</span><span style="color:var(--accent-text)">打开${esc(latest.tool)} ›</span></div>
          </a>`;
      }

      // 图标陈列：按顺序排开已完成的课，本周剩下的天数留空位
      const asc = days.slice().reverse();
      const wk = weeks.find(w => w.n === (latest ? latest.week : 1));
      const left = wk ? Math.max(0, wk.days - days.filter(d => d.week === wk.n).length) : 0;
      const nextDay = latest ? latest.day + 1 : 1;
      document.getElementById("dock").innerHTML =
        asc.map(d => `<a href="${esc(d.url)}" data-label="Day ${d.day} · ${esc(d.tool || d.title)}" aria-label="Day ${d.day}：${esc(d.title)}">${glyph(d, "sm")}</a>`).join("") +
        Array.from({ length: left }, (_, i) => `<span title="Day ${nextDay + i}，即将解锁"><div class="glyph sm locked">${nextDay + i}</div></span>`).join("");

      // 全部课程
      document.getElementById("tiles").innerHTML = days.map((d, i) => `
        <a class="tile reveal d${Math.min(i, 3)}" href="${esc(d.url)}">
          ${xuewan && xuewan.isLearned(d.day) ? '<span class="xuewan-mark" title="已学完"><span aria-hidden="true">✓</span><span class="sr-only">已学完</span></span>' : ""}
          ${glyph(d, "sm")}
          <span class="meta">Day ${d.day} · 第${d.week}周 · ${esc(weekName(d.week))}</span>
          <h3>${esc(d.title)}</h3>
          <p>${esc(d.summary)}</p>
          ${d.tool ? `<span class="foot">${esc(d.tool)}</span>` : ""}
        </a>`).join("");

      // 路线图
      const total = weeks.reduce((s, w) => s + w.days, 0) || 28;
      let start = 0;
      const curWeek = latest ? latest.week : 1;
      document.getElementById("roadmap").innerHTML = weeks.map((w, i) => {
        const done = days.filter(d => d.week === w.n).length;
        const pct = Math.round(Math.min(done, w.days) / w.days * 100);
        start += w.days;
        return `<div class="week reveal d${i} ${w.n === curWeek ? "now" : ""}">
          <div class="n">第 ${w.n} 周</div>
          <h4>${esc(w.title)}</h4>
          <div class="bar"><i style="--w:${pct}%"></i></div>
          <div class="p">${done ? `已完成 ${done} / ${w.days} 天` : "即将解锁"}</div>
        </div>`;
      }).join("");

      document.getElementById("s-days").textContent = days.length;
      document.getElementById("s-tools").textContent = days.filter(d => d.tool).length;
      document.getElementById("s-pct").textContent = Math.round(days.length / total * 100) + "%";
      if (xuewan) {
        const progress = xuewan.count(days.map(d => d.day));
        document.getElementById("s-learned").textContent = `${progress.learned} / ${progress.total}`;
      } else {
        document.getElementById("s-learned").parentElement.remove();
      }
      window.observeReveal && window.observeReveal();
    })();
  </script>
</body>
</html>
